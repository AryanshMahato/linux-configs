unbind C-b
set -g prefix C-Space
bind-key C-Space send-prefix


set -g mouse on

set-option -g status-position top

bind-key C send-keys "clear && tmux clear-history" \; send-keys "Enter"
bind -n M-L next-window
bind -n M-L previous-window
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind - split-window -v
bind _ split-window -h

set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'dreamsofcode-io/catppuccin-tmux'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'

set -g @catppuccin_flavor 'mocha'
set -g status-right ''
set -g default-terminal "tmux-256color"
set -g @catppuccin_window_status_style "rounded"
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_application}"
setw -g automatic-rename off
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_text "#W"

# Bootstrap tpm + plugins on a fresh machine
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

run '~/.tmux/plugins/tpm/tpm'


set -as terminal-features 'xterm*:extkeys'
set -g extended-keys always

set -s set-clipboard on
set -g allow-passthrough on
set -g set-titles on
set -g set-titles on
set -g set-titles-string "#{?#{m:[0-9]*,#{pane_current_command}},#{pane_title},#{pane_current_command} — #{b:pane_current_path}}"

# Active pane shown by dimming inactive panes; divider stays plain (no highlight)
set -g pane-border-status off
set -g pane-border-style "fg=#585b70"
set -g pane-active-border-style "fg=#585b70"
set -g window-style        "fg=#9399b2,bg=#181825"
set -g window-active-style "fg=#cdd6f4,bg=#1e1e2e"

# Git branch pill. Appended here, after `run-shell` — which blocks the command
# queue — so the catppuccin plugin has already rebuilt status-right by this point.
# The script emits its own #[...] styling (the gitmux pattern) and prints nothing
# outside a work tree, so the pill disappears instead of rendering empty.
set -ag status-right '#($HOME/.tmux/scripts/git-branch.sh "#{pane_current_path}")'
